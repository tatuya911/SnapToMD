name: Build and Release Android APK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+*' # v1.0 や v1.0.0 などのバージョンタグがPushされたときに起動
  workflow_dispatch: # GitHub上の画面から手動でも起動できるようにする（主に dev ブランチでのAPK生成用）
    inputs:
      version_name:
        description: '任意のバージョン名（空欄時はブランチ名と実行番号から自動生成）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # ステップの if では secrets を直接参照できず、ステップ自身の env も評価前のため参照できない。
      # そのためジョブレベルで「署名鍵が登録済みか」のフラグだけを公開する（鍵本体は各ステップで個別に渡す）
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # タグの main ブランチ包含チェックのため全履歴を取得

      - name: Verify Tag is on main Branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::タグ ${GITHUB_REF_NAME} のコミットが main ブランチに含まれていません。dev の変更を main へマージしてからタグを付与してください。"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Determine Version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            APK_FILE_NAME="SnapToMD-v${VERSION_NAME}.apk"
            ARTIFACT_NAME="SnapToMD-v${VERSION_NAME}"
          else
            if [[ -n "${INPUT_VERSION_NAME}" ]]; then
              VERSION_NAME="${INPUT_VERSION_NAME}"
            else
              VERSION_NAME="${SAFE_REF}.${GITHUB_RUN_NUMBER}"
            fi
            APK_FILE_NAME="SnapToMD-${SAFE_REF}-run${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
            ARTIFACT_NAME="SnapToMD-${SAFE_REF}-run${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          fi

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "apk_file_name=${APK_FILE_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Decode Keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${SIGNING_KEY_BASE64}" | base64 --decode > app/release-keystore.jks

      - name: Warn if Signing Key is Missing
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::warning::KEYSTORE_BASE64 が未設定のため、未署名APKが生成されます（端末にはインストールできません）"

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            --stacktrace

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-artifacts
          APK_FILE_NAME="${{ steps.version.outputs.apk_file_name }}"
          # 署名済みAPKまたは未署名APKを収集
          if ls app/build/outputs/apk/release/*-release.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*-release.apk "release-artifacts/${APK_FILE_NAME}"
          else
            cp app/build/outputs/apk/release/*.apk "release-artifacts/${APK_FILE_NAME}"
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: SnapToMD ${{ github.ref_name }}
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Write Build Summary
        if: always()
        run: |
          {
            echo "### ビルド結果"
            echo "- **トリガー**: \`${{ github.event_name }}\` (\`${{ github.ref_name }}\`)"
            echo "- **Version Name**: \`${{ steps.version.outputs.version_name }}\`"
            echo "- **Version Code**: \`${{ steps.version.outputs.version_code }}\`"
            echo "- **APK ファイル名**: \`${{ steps.version.outputs.apk_file_name }}\`"
            echo "- **署名鍵**: \`${{ env.HAS_SIGNING_KEY }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
